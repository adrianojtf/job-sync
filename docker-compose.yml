# Sobe backend (API) e frontend (UI) juntos: http://localhost:8080
services:
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Postgres instalado na máquina hospedeira (veja o README).
      DATABASE_URL: postgresql://job_sync:troque_a_senha@host.docker.internal:5432/job_sync
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
