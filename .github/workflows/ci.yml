name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run import-linter
        run: PYTHONPATH=src lint-imports

      - name: Run pytest
        run: PYTHONPATH=src pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r ../requirements.txt

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Contrato da API (tipos gerados do OpenAPI)
        run: |
          PYTHONPATH=../src python -c "import json; from jobsync.entrypoints.api.main import app; print(json.dumps(app.openapi()))" > "$RUNNER_TEMP/openapi.json"
          OPENAPI_URL="$RUNNER_TEMP/openapi.json" npm run gerar-tipos
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts está desatualizado. Rode 'npm run gerar-tipos' com o backend atual e faça commit."
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install -r ../requirements.txt
          npx playwright install --with-deps chromium

      - name: E2E e acessibilidade (Playwright + axe)
        run: npm run e2e
        env:
          E2E_PYTHON: python
