[importlinter]
root_package = jobsync
exclude_type_checking_imports = true

[importlinter:contract:jobsync-no-ciclos]
name = Ausencia de ciclos entre dominios
type = acyclic_siblings
ancestors =
    jobsync

[importlinter:contract:jobsync-camadas-por-dominio]
name = Camadas dentro de cada dominio
type = layers
layers =
    (service_layer) | (adapters)
    domain
containers =
    jobsync.ats_score
    jobsync.autenticacao
    jobsync.candidatura
    jobsync.curriculo
    jobsync.curriculo_adaptado
    jobsync.curriculo_salvo
    jobsync.perfil
    jobsync.perfil_estruturado
    jobsync.shared_kernel
    jobsync.token_captura
    jobsync.vaga
    jobsync.vaga_externa

[importlinter:contract:domain-isolado]
name = Domain nao importa camadas superiores
type = forbidden
source_modules =
    jobsync.*.domain
forbidden_modules =
    jobsync.*.adapters
    jobsync.*.service_layer
    jobsync.entrypoints
    jobsync.tests
